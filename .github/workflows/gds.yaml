name: gds

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  gds:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Restore cached IHP PDK (.ciel)
        id: cache-pdk-restore
        uses: actions/cache/restore@v4
        with:
          path: ~/.ciel
          key: ciel-ihp-sg13-89d42ee6d2fd9b50b86a1aada6fee6673c3e6008

      - name: Patch LibreLane httpx timeout and pre-fetch IHP PDK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker pull ghcr.io/librelane/librelane:3.1.0.dev4
          docker rm -f patch_librelane >/dev/null 2>&1 || true
          docker run --name patch_librelane ghcr.io/librelane/librelane:3.1.0.dev4 python3 -c '
          import os, stat, httpx
          cfg = os.path.realpath(os.path.join(os.path.dirname(httpx.__file__), "_config.py"))
          os.chmod(cfg, stat.S_IRUSR | stat.S_IWUSR | stat.S_IRGRP | stat.S_IROTH)
          s = open(cfg).read().replace("timeout=5.0", "timeout=120.0")
          open(cfg, "w").write(s)
          print("Successfully patched httpx default timeout to 120s in", cfg)
          '
          docker commit patch_librelane ghcr.io/librelane/librelane:3.1.0.dev4
          docker rm patch_librelane

          mkdir -p "$HOME/.ciel"
          docker run --rm -v "$HOME:$HOME" -e HOME="$HOME" -e GITHUB_TOKEN="$GITHUB_TOKEN" ghcr.io/librelane/librelane:3.1.0.dev4 python3 -c '
          import os, time, ciel
          pdk_root = os.path.expanduser("~/.ciel")
          version = "89d42ee6d2fd9b50b86a1aada6fee6673c3e6008"
          libs = ["sg13cmos5l_stdcell", "sg13cmos5l_io", "sg13cmos5l_sram"]
          for attempt in range(1, 6):
              try:
                  print(f"Fetching IHP PDK (attempt {attempt}/5) with 120s timeout...")
                  ciel.fetch(pdk_root, "ihp-sg13", version, include_libraries=libs)
                  print("IHP PDK is ready in ~/.ciel")
                  break
              except Exception as e:
                  print(f"Attempt {attempt} failed: {e}")
                  if attempt == 5:
                      raise
                  time.sleep(5 * attempt)
          '

      - name: Save IHP PDK (.ciel) to cache
        if: always() && steps.cache-pdk-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.ciel
          key: ciel-ihp-sg13-89d42ee6d2fd9b50b86a1aada6fee6673c3e6008

      - name: Build GDS
        uses: TinyTapeout/tt-gds-action@ttihp27a
        with:
          pdk: ihp-sg13cmos5l

  precheck:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: Run Tiny Tapeout Precheck
        uses: TinyTapeout/tt-gds-action/precheck@ttihp27a

  gl_test:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: GL test
        uses: TinyTapeout/tt-gds-action/gl_test@ttihp27a

  viewer:
    needs: gds
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: TinyTapeout/tt-gds-action/viewer@ttihp27a